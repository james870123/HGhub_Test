
name: Build HGhub iOS Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iPhone ARM64 IPA
    runs-on: macos-15
    timeout-minutes: 90

    env:
      CI: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-arm64

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          rustc --version

      - name: Install build tools
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          if ! command -v pod >/dev/null; then
            brew install cocoapods
          fi

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check Tauri CLI version
        shell: bash
        run: |
          pnpm exec tauri --version
          pnpm exec tauri ios build --help |
            grep -q -- "--no-sign" || {
              echo "Tauri CLI needs iOS --no-sign support."
              exit 1
            }
          pnpm exec tauri ios build --help |
            grep -q -- "--archive-only" || {
              echo "Tauri CLI needs --archive-only support."
              exit 1
            }

      - name: Initialize iOS project
        run: pnpm exec tauri ios init --ci

      - name: Build unsigned iOS archive
        run: |
          pnpm exec tauri ios build \
            --ci \
            --no-sign \
            --archive-only

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find src-tauri/gen/apple/build \
            -type d -path "*/Products/Applications/*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No iOS .app found in archive."
            find src-tauri/gen/apple/build -maxdepth 5 \
              -print || true
            exit 1
          fi

          echo "Found app: $APP_PATH"

          APP_NAME=$(basename "$APP_PATH")
          mkdir -p ipa-output/Payload

          cp -R "$APP_PATH" "ipa-output/Payload/$APP_NAME"

          (
            cd ipa-output
            zip -qry HGhub-iOS-unsigned.ipa Payload
          )

          test -s ipa-output/HGhub-iOS-unsigned.ipa

          unzip -l ipa-output/HGhub-iOS-unsigned.ipa |
            head -30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-Unsigned
          path: ipa-output/HGhub-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
