
name: Build HGhub Portable EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Portable EXE
        run: pnpm exec tauri build --no-bundle

      - name: Prepare Portable EXE
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/release/huangguo-client.exe"
          New-Item -ItemType Directory -Force "portable"
          Copy-Item $exe.FullName "portable/HGhub.exe"

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Windows-Portable
          path: portable/HGhub.exe
          if-no-files-found: error
